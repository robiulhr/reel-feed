<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Ecomgy Reel Feed</title>
  </head>
  <body>
    <div class="layout">
      <div class="shell">
        <header class="top">
          <div class="row1">
            <nav class="tabs" id="tabs">
              <button data-tab="foryou">For You</button>
              <button data-tab="trending">Trending</button>
              <button data-tab="popular">Popular</button>
              <button data-tab="newest">Newest</button>
            </nav>
            <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
          </div>
          <div class="row2">
            <select id="win" aria-label="Time range">
              <option value="all">All time</option>
              <option value="30">30 days</option>
              <option value="7">7 days</option>
              <option value="1">Today</option>
            </select>
            <div class="chips" id="chips"></div>
          </div>
        </header>

        <div class="frame" id="frame">
          <img id="poster" class="poster" alt="" />
          <div id="player"></div>
          <div class="tap" id="tap" aria-label="Tap to pause, double-tap to save, swipe for next"></div>
          <div class="center-icon" id="centerIcon" aria-hidden="true"></div>
          <div class="progress"><div id="bar"></div></div>
          <div class="empty" id="empty" hidden></div>
        </div>

        <footer class="bottom">
          <div class="info">
            <div class="ch-row">
              <img id="chThumb" class="ch-thumb" alt="" />
              <a id="chName" class="ch-name" target="_blank" rel="noopener"></a>
              <span id="badge" class="badge" hidden>NEW</span>
            </div>
            <p id="title" class="title"></p>
            <p id="meta" class="meta"></p>
          </div>
          <div class="actions">
            <button class="act" id="muteBtn" aria-label="Sound on/off" title="Sound (m)"><span class="ico">🔇</span></button>
            <button class="act" id="saveBtn" aria-label="Save" title="Save (s)"><span class="ico">♡</span></button>
            <button class="act" id="shareBtn" aria-label="Share link" title="Share link"><span class="ico">⤴</span></button>
            <button class="act" id="hideBtn" aria-label="Hide this channel" title="Hide channel"><span class="ico">⊘</span></button>
            <a class="act" id="openBtn" target="_blank" rel="noopener" aria-label="Open on YouTube" title="Open on YouTube"><span class="ico">↗</span></a>
          </div>
        </footer>
      </div>

      <div class="side-nav">
        <button class="icon-btn" id="prevBtn" aria-label="Previous" title="Previous (↑)">▲</button>
        <button class="icon-btn" id="nextBtn" aria-label="Next" title="Next (↓)">▼</button>
      </div>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="panel-inner">
        <div class="panel-head">
          <nav class="ptabs" id="ptabs">
            <button data-p="channels">Channels</button>
            <button data-p="saved">Saved</button>
            <button data-p="hidden">Hidden</button>
            <button data-p="sync">Sync</button>
            <button data-p="about">About</button>
          </nav>
          <button class="icon-btn" id="closePanel" aria-label="Close">✕</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
