name: Fetch Shorts & deploy

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours
  push:
    branches: [main]
  pull_request: # e.g. Dependabot library updates — tested, never deployed
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # library-update pull requests get their own lane so they never hold up publishing
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  # Automated tests — run when the app's code changes. A failure stops the deploy below,
  # so a broken version never reaches your phone. Skipped for scheduled refreshes,
  # "Refresh now", and channel-list edits from the app (no code changed → nothing to test).
  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Channels (from app)'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit (known vulnerabilities in libraries)
        run: npm audit --audit-level=high
        continue-on-error: true # warns in the log; Dependabot opens the fix
      - name: Lint + formatting (Biome)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit + server tests
        run: npm test
      - name: Install browser for tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone sizes)
        run: npm run test:e2e
      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    # run after passing tests, or when tests were skipped (scheduled refresh / channel edits)
    if: always() && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep the YouTube cache between runs so each refresh only fetches what's new
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: yt-cache-${{ github.run_id }}
          restore-keys: yt-cache-

      - name: Fetch Shorts from YouTube
        run: npm run fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - uses: actions/cache/save@v6
        if: always() # keep the cache (and the API usage log) even if the fetch failed
        with:
          path: data
          key: yt-cache-${{ github.run_id }}

      - run: npm run build
        env:
          # Address of the sync Worker (repo Settings → Secrets and variables → Actions → Variables)
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The same app on Cloudflare (https://reel-feed.robiulhr2201.workers.dev), where sync is
      # reached at /api on the same address. Built again only to change that one setting.
      - run: npm run build
        env:
          VITE_SYNC_URL: /api
      - name: Deploy to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy --config app.wrangler.toml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
