name: Deploy sync Worker

# Puts the Cloudflare Worker (worker/) live whenever its code changes on main.
# Needs one repo secret: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers").
# Optional repo variable CLOUDFLARE_ACCOUNT_ID — only if that token can reach more than one account.
# The Worker's own secrets (GitHub token, password, …) live in Cloudflare and are kept on every deploy.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      # the Worker checks categories and sorts Facebook videos with these two files, so it must be
      # redeployed when they change (a new category was refused as "Unknown" until it was)
      - "src/categories.ts"
      - "src/classify.ts"
      - ".github/workflows/worker.yml"
  pull_request: # type-checked only, never deployed
    branches: [main]
    paths:
      - "worker/**"
      - "src/categories.ts"
      - "src/classify.ts"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: worker-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Check the token is set
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repo secret (see README → Sync Worker → Automatic deploys)."
            exit 1
          fi
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
