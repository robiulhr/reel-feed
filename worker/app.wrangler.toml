# The app itself (deployed by .github/workflows/deploy.yml after each build — not by hand).
# Address: https://reel-feed.robiulhr2201.workers.dev
name = "reel-feed"
main = "src/app.ts"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application" # any page link opens the app
run_worker_first = ["/*"]  # every request runs the password gate first (worker/src/gate.ts); then files are served

# /api/* → the sync Worker, inside Cloudflare (no extra address, no cross-site requests)
[[services]]
binding = "SYNC"
service = "reel-feed-sync"
