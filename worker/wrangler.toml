name = "reel-feed-sync"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true     # address: https://reel-feed-sync.robiulhr2201.workers.dev
preview_urls = false   # no extra per-version preview addresses

[vars]
# PRIVATE repo that stores user-state.json (saves, history, learning)
DATA_REPO = "robiulhr/reel-feed-data"
# Code repo that holds channels.json and the refresh workflow
CODE_REPO = "robiulhr/reel-feed"
WORKFLOW_FILE = "deploy.yml"
# Sites allowed to call this Worker (local dev addresses are always allowed)
ALLOWED_ORIGINS = "https://reel-feed.robiulhr2201.workers.dev,https://freed.ecomgy.com,https://reel-feed.ecomgy.com,https://robiulhr.github.io"

# Free KV store: daily YouTube-quota counter, budget setting, cached channel previews & searches
[[kv_namespaces]]
binding = "QUOTA"
id = "6b32bc97b6b643069fcd92fc65a34815"

# Secrets — set with `npx wrangler secret put <NAME>`, never put them in this file:
#   GITHUB_TOKEN, APP_PASSWORD, SESSION_SECRET, YOUTUBE_API_KEY
